app = "doorclub-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 2

[env]
  PORT = "3001"
  NODE_ENV = "production"
  BLENDER_AUTORIG_ENABLED = "1"
  BLENDER_PATH = "/usr/bin/blender"
  BLENDER_AUTORIG_TIMEOUT_MS = "300000"
